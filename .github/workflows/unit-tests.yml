name: Unit Tests

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    unit-tests:
        name: Vitest
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up project
              uses: ./.github/actions/setup-project

            - name: Run unit tests
              run: bun run test
