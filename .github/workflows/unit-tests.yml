name: Unit Tests

on:
    # Manual trigger for now. Add push and pull_request triggers when
    # the `test` script is available in package.json.
    workflow_dispatch:

jobs:
    unit-tests:
        name: Vitest
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up project
              uses: ./.github/actions/setup-project

            - name: Run unit tests
              run: bun run test
