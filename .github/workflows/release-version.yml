name: Release Version

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release-version:
        runs-on: ubuntu-latest
        steps:
            - name: Create or update release pull request
              uses: googleapis/release-please-action@v4
              with:
                  config-file: .github/workflows/release-version-config.json
                  manifest-file: release-version-manifest.json
